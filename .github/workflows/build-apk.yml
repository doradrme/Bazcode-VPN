name: Build Bazcode APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4


      - name: Download official libv2ray.aar from v2rayNG 1.6.30
        run: |
          mkdir -p V2rayNG/app/libs
          curl -L --fail --retry 3 \
            "https://raw.githubusercontent.com/2dust/v2rayNG/1.6.30/V2rayNG/app/libs/libv2ray.aar" \
            -o V2rayNG/app/libs/libv2ray.aar
          ls -lh V2rayNG/app/libs/libv2ray.aar

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 30
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-30" "build-tools;30.0.2"

      - name: Show environment
        run: |
          java -version
          sdkmanager --list_installed
          cd V2rayNG
          chmod +x gradlew
          ./gradlew --version

      - name: Build debug APK
        working-directory: V2rayNG
        run: |
          chmod +x gradlew
          ./gradlew clean assembleDebug --no-daemon --stacktrace

      - name: Collect APKs
        if: always()
        run: |
          mkdir -p artifacts
          find V2rayNG/app/build/outputs/apk -type f -name "*.apk" -exec cp {} artifacts/ \; 2>/dev/null || true
          ls -lah artifacts || true

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Bazcode-APK
          path: artifacts/*.apk
          if-no-files-found: error
          retention-days: 14
