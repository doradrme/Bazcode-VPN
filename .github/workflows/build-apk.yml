name: Build Bazcode APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# Temporary, version-scoped permission used only by the exact 1.6.4 publish commit.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download official libv2ray.aar from v2rayNG 1.6.30
        run: |
          mkdir -p V2rayNG/app/libs
          curl -L --fail --retry 3 \
            "https://raw.githubusercontent.com/2dust/v2rayNG/1.6.30/V2rayNG/app/libs/libv2ray.aar" \
            -o V2rayNG/app/libs/libv2ray.aar
          ls -lh V2rayNG/app/libs/libv2ray.aar

      - name: Set up JDK 17 for Android SDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Verify Java 17 installation
        run: java -version

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 30
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-30" "build-tools;30.0.2"

      - name: Set up JDK 11 for Gradle
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 11
          cache: gradle

      - name: Show environment
        run: |
          java -version
          cd V2rayNG
          chmod +x gradlew
          ./gradlew --version

      - name: Build debug APK
        working-directory: V2rayNG
        run: |
          chmod +x gradlew
          ./gradlew clean assembleDebug --no-daemon --stacktrace

      - name: Collect APKs
        if: always()
        run: |
          mkdir -p artifacts
          find V2rayNG/app/build/outputs/apk -type f -name "*.apk" -exec cp {} artifacts/ \; 2>/dev/null || true
          ls -lah artifacts || true

      - name: Name versioned APKs
        if: success()
        run: |
          VERSION=$(sed -n 's/.*versionName "\([^"]*\)".*/\1/p' V2rayNG/app/build.gradle | head -n 1)
          for apk in artifacts/*.apk; do
            base=$(basename "$apk")
            mv "$apk" "artifacts/Bazcode-VPN-${VERSION}-${base}"
          done
          ls -lah artifacts

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Bazcode-APK
          path: artifacts/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish Bazcode VPN 1.6.4
        if: success() && github.event_name == 'push' && github.event.head_commit.message == 'Publish Bazcode VPN 1.6.4'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(sed -n 's/.*versionName "\([^"]*\)".*/\1/p' V2rayNG/app/build.gradle | head -n 1)
          test "$VERSION" = "1.6.4"
          gh release create v1.6.4 artifacts/*.apk \
            --target "$GITHUB_SHA" \
            --title "Bazcode VPN 1.6.4" \
            --notes "Real Delay All now tests every configuration through an isolated Xray proxy without stopping the active VPN or changing the selected server. Versioned APKs are attached for ARMv7, ARM64, x86, x86_64, and universal devices."
